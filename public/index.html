<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RELAY_CORE // Real-Time Engineering Comms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            canvas: '#09090b',
            surface: '#121215',
            elevated: '#18181c',
            line: '#27272a'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/custom.css" />
</head>
<body class="bg-canvas text-zinc-100 font-sans antialiased h-screen overflow-hidden select-none">

  <!-- Modal Otentikasi Sesi Awal -->
  <div id="authModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-surface border border-line rounded-sm shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-line flex items-center justify-between bg-elevated">
        <div>
          <span class="font-mono text-[10px] tracking-widest text-zinc-400 block">WEBSOCKET HANDSHAKE</span>
          <h2 class="text-sm font-semibold text-zinc-100">Inisialisasi Sesi Komunikasi</h2>
        </div>
        <span class="font-mono text-[11px] px-2 py-0.5 bg-zinc-800 text-zinc-300 border border-zinc-700">WS // v1.0</span>
      </div>

      <form id="joinForm" class="p-6 space-y-4" autocomplete="off">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Username / Callsign</label>
          <input
            type="text"
            id="usernameInput"
            required
            maxlength="24"
            placeholder="mis. bias_tegar"
            class="w-full bg-canvas border border-line px-3 py-2 text-sm text-zinc-100 font-mono focus:outline-none focus:border-zinc-400"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">Divisi / Role</label>
            <select
              id="roleInput"
              class="w-full bg-canvas border border-line px-3 py-2 text-xs text-zinc-100 font-mono focus:outline-none focus:border-zinc-400"
            >
              <option value="FRONTEND">FRONTEND</option>
              <option value="BACKEND">BACKEND</option>
              <option value="DEVOPS">DEVOPS</option>
              <option value="QA_LEAD">QA_LEAD</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">Channel Awal</label>
            <select
              id="channelInput"
              class="w-full bg-canvas border border-line px-3 py-2 text-xs text-zinc-100 font-mono focus:outline-none focus:border-zinc-400"
            >
              <option value="general">#general</option>
              <option value="engineering">#engineering</option>
              <option value="deployments">#deployments</option>
            </select>
          </div>
        </div>

        <button
          type="submit"
          class="w-full mt-2 bg-zinc-100 hover:bg-zinc-300 text-zinc-950 font-medium text-xs py-2.5 px-4 transition flex items-center justify-between"
        >
          <span>HUBUNGKAN KE WORKSPACE</span>
          <span class="font-mono text-[10px] bg-zinc-950/15 px-1.5 py-0.5">ENTER</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Layout Utama Aplikasi -->
  <div class="h-screen flex flex-col">
    <!-- Top Header Telemetry -->
    <header class="h-12 border-b border-line bg-surface px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-zinc-100 text-canvas font-mono font-semibold text-xs flex items-center justify-center">
          RC
        </div>
        <div class="flex items-center gap-2">
          <span class="font-mono text-xs font-semibold tracking-wider">RELAY_CORE</span>
          <span class="text-zinc-600">/</span>
          <span id="activeChannelHeader" class="font-mono text-xs text-emerald-400">#general</span>
        </div>
      </div>

      <div class="flex items-center gap-4 font-mono text-[11px]">
        <div class="flex items-center gap-2 px-2.5 py-1 bg-canvas border border-line">
          <span id="connStatusDot" class="w-2 h-2 rounded-full bg-zinc-500"></span>
          <span id="connStatusText" class="text-zinc-400">STANDBY</span>
        </div>
        <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-canvas border border-line text-zinc-400">
          <span>LATENCY:</span>
          <span id="pingValue" class="text-zinc-200">0 ms</span>
        </div>
      </div>
    </header>

    <!-- Workspace Body -->
    <div class="flex-1 grid grid-cols-12 overflow-hidden">
      <!-- Sidebar Kiri: Daftar Channel & Info Sesi -->
      <aside class="col-span-3 lg:col-span-2 border-r border-line bg-surface flex flex-col justify-between">
        <div class="p-3 space-y-5">
          <div>
            <div class="px-2 mb-2 flex items-center justify-between">
              <span class="font-mono text-[10px] tracking-wider text-zinc-500">CHANNELS</span>
              <span class="font-mono text-[10px] text-zinc-600">03</span>
            </div>
            <nav id="channelList" class="space-y-1 font-mono text-xs">
              <button data-channel="general" class="channel-btn w-full text-left px-2.5 py-1.5 bg-elevated text-zinc-100 border border-line flex items-center justify-between">
                <span># general</span>
              </button>
              <button data-channel="engineering" class="channel-btn w-full text-left px-2.5 py-1.5 text-zinc-400 hover:text-zinc-200 hover:bg-elevated/50 border border-transparent flex items-center justify-between">
                <span># engineering</span>
              </button>
              <button data-channel="deployments" class="channel-btn w-full text-left px-2.5 py-1.5 text-zinc-400 hover:text-zinc-200 hover:bg-elevated/50 border border-transparent flex items-center justify-between">
                <span># deployments</span>
              </button>
            </nav>
          </div>
        </div>

        <!-- Panel Identitas Pengguna Saat Ini -->
        <div class="p-3 border-t border-line bg-canvas/60">
          <span class="font-mono text-[10px] text-zinc-500 block mb-1">ACTIVE OPERATOR</span>
          <div class="flex items-center justify-between">
            <span id="currentUserDisplay" class="font-mono text-xs text-zinc-200 truncate">-</span>
            <span id="currentRoleDisplay" class="font-mono text-[10px] px-1.5 py-0.5 bg-zinc-800 text-zinc-300 border border-zinc-700">-</span>
          </div>
        </div>
      </aside>

      <!-- Panel Tengah: Stream Pesan & Input -->
      <main class="col-span-9 lg:col-span-8 flex flex-col bg-canvas overflow-hidden">
        <!-- Area Log Pesan -->
        <div id="messageContainer" class="flex-1 overflow-y-auto divide-y divide-line/40 select-text">
          <div class="p-6 font-mono text-xs text-zinc-500">
            Menunggu inisialisasi sesi WebSocket...
          </div>
        </div>

        <!-- Bar Indikator Mengetik -->
        <div class="h-6 px-4 bg-surface/60 border-t border-line/60 flex items-center">
          <span id="typingIndicator" class="font-mono text-[11px] text-zinc-400"></span>
        </div>

        <!-- Form Input Pesan -->
        <form id="messageForm" class="p-3 bg-surface border-t border-line flex gap-2" autocomplete="off">
          <span class="font-mono text-xs text-zinc-500 flex items-center pl-2">&gt;</span>
          <input
            type="text"
            id="messageInput"
            placeholder="Ketik pesan transmisi ke channel..."
            maxlength="600"
            class="flex-1 bg-canvas border border-line px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 font-sans"
          />
          <button
            type="submit"
            class="bg-zinc-100 hover:bg-zinc-300 text-zinc-950 font-mono text-xs font-medium px-4 py-2 transition shrink-0"
          >
            TRANSMIT
          </button>
        </form>
      </main>

      <!-- Sidebar Kanan: Daftar Pengguna Online di Channel -->
      <aside class="hidden lg:flex lg:col-span-2 border-l border-line bg-surface flex-col">
        <div class="p-3 border-b border-line flex items-center justify-between">
          <span class="font-mono text-[10px] tracking-wider text-zinc-400">ONLINE NODES</span>
          <span id="onlineCountBadge" class="font-mono text-[11px] px-1.5 py-0.2 bg-emerald-950/60 text-emerald-400 border border-emerald-800/60">0</span>
        </div>
        <div id="userListContainer" class="p-3 space-y-2 overflow-y-auto flex-1 font-mono text-xs">
          <!-- Diisi secara dinamis via WebSocket -->
        </div>
      </aside>
    </div>
  </div>

  <!-- Socket.IO Client Library (Otomatis disediakan oleh server Socket.IO) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
